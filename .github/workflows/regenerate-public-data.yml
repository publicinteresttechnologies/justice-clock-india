name: Regenerate public data

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/regenerate-public-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Restore IMLJD Supreme Court judgment import
        run: npm run import:imljd

      - name: Generate public data and build
        run: |
          npm run data:build
          npm run build

      - name: Commit regenerated public data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json data/imports/judgments.csv public/data/court-clock.json public/data/case-types.json public/data/judges.json public/data/judgments.json public/data/justice-clock-data.json
          if git diff --cached --quiet; then
            echo "No public data changes to commit."
          else
            git commit -m "Regenerate public data from imported sources"
            git push
          fi
