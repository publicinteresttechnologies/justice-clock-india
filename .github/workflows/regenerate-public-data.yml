name: Regenerate public data

on:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/regenerate-public-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Refresh Supreme Court NJDG snapshot
        shell: bash
        run: |
          cp data/imports/court-snapshot.json /tmp/court-snapshot-before-refresh.json
          if npm run import:njdg -- --fetch-live; then
            echo "Refreshed NJDG snapshot from the official public Supreme Court dashboard."
          else
            echo "WARN: live NJDG refresh failed; retaining the last committed snapshot."
            cp /tmp/court-snapshot-before-refresh.json data/imports/court-snapshot.json
            npm run import:njdg
          fi

      - name: Refresh IMLJD rows from the independent upstream dataset
        shell: bash
        run: |
          cp data/imports/judgments.csv /tmp/judgments-before-imljd.csv
          if npm run import:imljd; then
            npx tsx scripts/merge-imljd-import.ts \
              --base=/tmp/judgments-before-imljd.csv \
              --fresh=data/imports/judgments.csv \
              --output=data/imports/judgments.csv
          else
            echo "WARN: upstream IMLJD refresh failed; retaining the committed import snapshot."
            cp /tmp/judgments-before-imljd.csv data/imports/judgments.csv
          fi

      - name: Generate public data and verify production build
        run: |
          npm run data:build
          npm test
          npm run lint
          npm run build

      - name: Commit regenerated public data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imports/court-snapshot.json data/imports/judgments.csv data/research/njdg-snapshots public/data/*.json
          if git diff --cached --quiet; then
            echo "No public data changes to commit."
          else
            git commit -m "Regenerate public data from upstream sources"
            git push
          fi
