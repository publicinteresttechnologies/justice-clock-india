name: Inspect upstream Supreme Court data

on:
  push:
    branches:
      - agent/fix-six-verified-problems
    paths:
      - .github/workflows/inspect-upstream-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pandas pyarrow
      - name: Inspect parquet schemas and candidate fields
        run: |
          python <<'PY' > /tmp/parquet-report.txt
          import json, re
          from urllib.request import urlopen
          import pandas as pd

          base = "https://indian-supreme-court-judgments.s3.amazonaws.com/metadata/parquet/year={year}/metadata.parquet"
          candidates = [
              "case_type", "caseType", "case_category", "category", "docket_type", "matter_type",
              "case_number", "case_no", "caseNumber", "diary_number", "diary_no", "cnr",
              "raw_html", "path", "title", "citation", "nc_display"
          ]
          for year in (1950, 2000, 2024):
              url = base.format(year=year)
              path = f"/tmp/{year}.parquet"
              with urlopen(url, timeout=120) as response:
                  open(path, "wb").write(response.read())
              frame = pd.read_parquet(path)
              print(f"YEAR {year} rows={len(frame)}")
              print("COLUMNS", json.dumps(list(frame.columns)))
              present = [name for name in candidates if name in frame.columns]
              print("CANDIDATES_PRESENT", json.dumps(present))
              print("NON_NULL_COUNTS", json.dumps({name: int(frame[name].notna().sum()) for name in present}))
              for idx, row in frame.head(5).iterrows():
                  picked = {name: str(row[name])[:1500] for name in present if pd.notna(row[name])}
                  print("SAMPLE", idx, json.dumps(picked, ensure_ascii=False))
              if "raw_html" in frame.columns:
                  patterns = {
                      "civil_appeal": r"Civil\s+Appeal",
                      "criminal_appeal": r"Criminal\s+Appeal",
                      "slp_civil": r"SLP\s*\(?C\)?|Special\s+Leave\s+Petition\s*\(?Civil\)?",
                      "slp_criminal": r"SLP\s*\(?Crl\.?\)?|Special\s+Leave\s+Petition\s*\(?Criminal\)?",
                      "writ": r"Writ\s+Petition|WP\s*\(?[A-Z]*\)?",
                      "review": r"Review\s+Petition",
                      "contempt": r"Contempt\s+Petition",
                      "transfer": r"Transfer\s+Petition",
                  }
                  html = frame["raw_html"].fillna("").astype(str)
                  print("RAW_HTML_PATTERN_COUNTS", json.dumps({key: int(html.str.contains(pattern, case=False, regex=True).sum()) for key, pattern in patterns.items()}))
              print()
          PY
      - name: Inspect current NJDG Supreme Court page
        run: |
          set -x
          curl -L --retry 3 --connect-timeout 30 --max-time 120 -A 'Mozilla/5.0' 'https://scdg.sci.gov.in/scnjdg/?p=home' -o /tmp/njdg.html || true
          curl -L --retry 3 --connect-timeout 30 --max-time 120 -A 'Mozilla/5.0' 'https://njdg.ecourts.gov.in/scnjdg/' -o /tmp/njdg-old.html || true
          {
            echo '=== FILE SIZES ==='
            wc -c /tmp/njdg.html /tmp/njdg-old.html 2>/dev/null || true
            echo '=== RELEVANT TEXT CURRENT ==='
            grep -Eio '.{0,120}(Pending Civil Cases|Pending Criminal Cases|Instituted in last month|Disposed In Last Month|more than 10 years old|3 Judge|5 Judge|7 Judge).{0,180}' /tmp/njdg.html | head -100 || true
            echo '=== ENDPOINT/JS CLUES ==='
            grep -Eio '(src|href|url)[=:]["'"'][^"'"']+' /tmp/njdg.html | head -200 || true
          } > /tmp/njdg-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-inspection
          path: |
            /tmp/parquet-report.txt
            /tmp/njdg-report.txt
            /tmp/njdg.html
            /tmp/njdg-old.html
          retention-days: 3
