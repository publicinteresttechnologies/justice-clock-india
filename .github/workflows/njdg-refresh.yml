name: Refresh NJDG snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch live NJDG snapshot
        run: npm run fetch:njdg

      - name: Generate public data and build
        run: |
          npm run data:build
          npm run build

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imports/court-snapshot.json public/data/court-clock.json public/data/njdg-latest.json public/data/justice-clock-data.json public/data/site-summary.json public/data/sources.json
          if git diff --cached --quiet; then
            echo "No NJDG snapshot changes to commit."
          else
            git commit -m "Refresh NJDG snapshot"
            git push
          fi
