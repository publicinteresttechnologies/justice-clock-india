name: Refresh pnpm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-six-verified-problems
    paths:
      - package.json
      - .github/workflows/refresh-pnpm-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-six-verified-problems
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh pnpm lockfile for Vitest patch" || exit 0
          git push origin HEAD:agent/fix-six-verified-problems
