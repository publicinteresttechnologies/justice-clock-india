name: Reimport Supreme Court case types

on:
  push:
    branches:
      - agent/fix-six-verified-problems
    paths:
      - .github/workflows/reimport-case-types.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reimport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-six-verified-problems
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install --upgrade pandas pyarrow
      - name: Reimport historical Supreme Court metadata
        run: python3 scripts/import-sc-metadata.py --start-year 1950 --end-year 2024 --fail-under 30000
      - name: Regenerate static public data
        run: |
          npm install
          npm run data
      - name: Commit regenerated corpus and aggregates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imports/judgments.csv data/research/sc-judgments-1950-2024.csv data/research/sc-corpus-summary.json public/data
          git commit -m "Reclassify Supreme Court judgment case types" || exit 0
          git push origin HEAD:agent/fix-six-verified-problems
